---
- name: Provision Canonical Kubernetes (Snap) Packages
  hosts: k8s_snap
  gather_facts: false 
  tasks:
    - name: Wait for LXD VM to boot and become reachable
      wait_for_connection:
        timeout: 120

    - name: Gather OS facts now that system is up
      setup:

    - name: Wait for snapd system seed to complete (Ubuntu boot requirement)
      command: snap wait system seed.loaded
      changed_when: false
      retries: 10
      delay: 5

    - name: Install Canonical K8s Snap
      command: snap install k8s --channel=1.32-classic/stable --classic
      register: snap_install
      until: snap_install.rc == 0
      retries: 3
      delay: 10
      changed_when: "'installed' in snap_install.stdout or 'k8s' in snap_install.stdout"

- name: Bootstrap Control Plane
  hosts: k8s_snap[0] # Node 1
  tasks:
    - name: Run k8s bootstrap
      command: k8s bootstrap
      register: bootstrap_out
      failed_when: 
        - bootstrap_out.rc != 0
        - "'already part of a cluster' not in bootstrap_out.stderr"
      changed_when: bootstrap_out.rc == 0

- name: Join Worker Nodes
  hosts: k8s_snap[1:] # Node 2 & 3
  tasks:
    - name: Check if node is already joined
      command: k8s status
      register: k8s_status
      failed_when: false
      changed_when: false

    - name: Generate join token for this specific worker on Control Plane
      # Burada Ansible'a: "Bu komutu Node 1'de (Control Plane) çalıştır ama benim ismime (inventory_hostname) özel token üret" diyoruz.
      command: "k8s get-join-token {{ inventory_hostname }} --worker"
      delegate_to: "{{ groups['k8s_snap'][0] }}"
      register: join_token_output
      when: k8s_status.rc != 0 or 'Not Ready' in k8s_status.stdout
      changed_when: false

    - name: Join the cluster
      command: "k8s join-cluster {{ join_token_output.stdout | trim }}"
      when: k8s_status.rc != 0 or 'Not Ready' in k8s_status.stdout
---
- name: Provision Canonical Kubernetes (Snap) Packages
  hosts: k8s_snap
  gather_facts: false 
  tasks:
    - name: Wait for LXD VM to boot and become reachable
      wait_for_connection:
        timeout: 120

    - name: Gather OS facts now that system is up
      setup:

    - name: Wait for snapd system seed to complete (Ubuntu boot requirement)
      command: snap wait system seed.loaded
      changed_when: false
      retries: 10
      delay: 5

    - name: Install Canonical K8s Snap
      command: snap install k8s --channel=latest/stable --classic
      register: snap_install
      until: snap_install.rc == 0
      retries: 3
      delay: 10
      changed_when: "'installed' in snap_install.stdout or 'k8s' in snap_install.stdout"

- name: Bootstrap Control Plane
  hosts: k8s_snap[0] # Node 1
  tasks:
    - name: Check if cluster is already bootstrapped
      stat:
        path: /var/snap/k8s/current/certs/ca.crt
      register: k8s_ca

    - name: Run k8s bootstrap
      command: k8s bootstrap
      when: not k8s_ca.stat.exists

    - name: Generate join token for workers
      command: k8s add-node
      register: join_cmd_output
      changed_when: true

    - name: Parse join token
      set_fact:
        k8s_join_command: "{{ join_cmd_output.stdout_lines[-1] }}"

- name: Join Worker Nodes
  hosts: k8s_snap[1:] # Node 2 & 3
  tasks:
    - name: Check if node is already joined
      command: k8s status
      register: k8s_status
      failed_when: false
      changed_when: false

    - name: Run k8s join
      command: "{{ hostvars[groups['k8s_snap'][0]]['k8s_join_command'] }}"
      when: "'Not Ready' in k8s_status.stdout or k8s_status.rc != 0"
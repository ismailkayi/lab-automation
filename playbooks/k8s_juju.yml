---
# ==============================================================================
# Canonical Kubernetes via Juju
# Deploys Canonical K8s using the canonical-kubernetes bundle on VMs provisioned
# by OpenTofu/LXD. Juju CLI runs on the host (localhost) to avoid
# snap confinement/cgroup issues in LXD guest agent sessions.
# ==============================================================================

- name: Collect host UID for Juju SSH compatibility
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read local host UID
      command: id -u
      register: local_uid_cmd
      changed_when: false

    - name: Store local host UID fact
      set_fact:
        juju_local_uid: "{{ local_uid_cmd.stdout | trim }}"

- name: Wait for Juju nodes and gather facts
  hosts: k8s_juju_controller:k8s_juju_cp:k8s_juju_workers
  gather_facts: false
  tasks:
    - name: Wait for node VM to boot
      wait_for_connection:
        timeout: 120

    - name: Gather facts
      setup:

    - name: Wait for snapd seed
      command: snap wait system seed.loaded
      changed_when: false

    - name: Check if local host UID exists on node
      command: "getent passwd {{ hostvars['localhost']['juju_local_uid'] }}"
      register: local_uid_entry
      changed_when: false
      failed_when: false

    - name: Ensure local host UID exists on node for Juju
      user:
        name: "jujuuid{{ hostvars['localhost']['juju_local_uid'] }}"
        uid: "{{ hostvars['localhost']['juju_local_uid'] | int }}"
        create_home: false
        shell: "/usr/sbin/nologin"
      become: true
      when: local_uid_entry.rc != 0

- name: Bootstrap Juju and deploy Canonical Kubernetes from host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    juju_model: "k8s-lab"
    juju_controller: "lab-controller"
    juju_controller_host: "{{ groups['k8s_juju_controller'][0] }}"
    juju_controller_ip: "{{ hostvars[juju_controller_host]['ansible_facts']['default_ipv4']['address'] }}"
    juju_cp_hosts: "{{ groups['k8s_juju_cp'] | default([]) }}"
    juju_worker_hosts: "{{ groups['k8s_juju_workers'] | default([]) }}"
    juju_machine_hosts: "{{ juju_cp_hosts + juju_worker_hosts }}"
    juju_bin: "juju"
  tasks:
    - name: Check if Juju exists in PATH
      command: command -v juju
      register: juju_bin_check
      changed_when: false
      failed_when: false

    - name: Check if Juju exists at /snap/bin/juju
      stat:
        path: /snap/bin/juju
      register: juju_snap_bin

    - name: Set Juju binary path
      set_fact:
        juju_bin: "{{ '/snap/bin/juju' if juju_bin_check.rc != 0 and juju_snap_bin.stat.exists else 'juju' }}"

    - name: Validate Juju binary is executable
      command: "{{ juju_bin }} version"
      register: juju_version_check
      changed_when: false
      failed_when: false

    - name: Fail if Juju CLI is missing on host
      fail:
        msg: >
          Juju CLI is not installed on host. Install it and rerun:
          sudo snap install juju --classic
          (If already installed via snap, ensure /snap/bin is in PATH.)
      when: juju_version_check.rc != 0

    - name: Check if Juju controller already bootstrapped
      command: "{{ juju_bin }} controllers --format json"
      register: juju_ctrl_check
      changed_when: false
      failed_when: false

    - name: Add controller IP to known_hosts
      known_hosts:
        name: "{{ juju_controller_ip }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + juju_controller_ip) }}"
        state: present

    - name: Bootstrap Juju manual cloud on controller VM
      command: >
        {{ juju_bin }} bootstrap
        manual/ubuntu@{{ juju_controller_ip }}
        {{ juju_controller }}
      when: >
        juju_ctrl_check.rc != 0 or
        juju_controller not in (juju_ctrl_check.stdout | default(''))

    - name: Add or reuse Juju model
      command: "{{ juju_bin }} add-model {{ juju_model }} {{ juju_controller }}"
      register: add_model_result
      failed_when:
        - add_model_result.rc != 0
        - "'already exists' not in (add_model_result.stderr | default(''))"
      changed_when: add_model_result.rc == 0

    - name: Add Juju machine target IPs to known_hosts
      known_hosts:
        name: "{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + hostvars[item]['ansible_facts']['default_ipv4']['address']) }}"
        state: present
      loop: "{{ juju_machine_hosts }}"

    - name: Add Juju machines for Kubernetes nodes
      command: >
        {{ juju_bin }} add-machine
        -m {{ juju_controller }}:{{ juju_model }}
        ssh:ubuntu@{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}
      loop: "{{ juju_machine_hosts }}"
      register: add_machines_result
      failed_when:
        - add_machines_result.rc != 0
        - "'already' not in (add_machines_result.stderr | default('') | lower)"
      changed_when: add_machines_result.rc == 0

    - name: Check if k8s application is already deployed
      command: >
        {{ juju_bin }} status -m {{ juju_controller }}:{{ juju_model }}
        --format json
      register: juju_status
      changed_when: false
      failed_when: false

    - name: Deploy canonical-kubernetes bundle
      command: >
        {{ juju_bin }} deploy canonical-kubernetes
        -m {{ juju_controller }}:{{ juju_model }}
        --map-machines existing
        --num-units {{ juju_machine_hosts | length }}
      when: >
        juju_status.rc != 0 or
        (
          '"k8s"' not in (juju_status.stdout | default('')) and
          '"canonical-kubernetes"' not in (juju_status.stdout | default(''))
        )
      changed_when: true

    - name: Wait for Juju deployment to settle
      command: >
        {{ juju_bin }} status
        -m {{ juju_controller }}:{{ juju_model }}
        --wait=30m
      changed_when: false

    - name: Show final Juju status
      command: >
        {{ juju_bin }} status
        -m {{ juju_controller }}:{{ juju_model }}
        --color
      register: final_juju_status
      changed_when: false

    - name: Print Juju status
      debug:
        msg: "{{ final_juju_status.stdout_lines }}"

    - name: Fetch kubeconfig from k8s/leader
      command: >
        {{ juju_bin }} run k8s/leader get-kubeconfig
        -m {{ juju_controller }}:{{ juju_model }}
        --format plain
      register: kubeconfig_out
      changed_when: false
      failed_when: false

    - name: Fetch kubeconfig from canonical-kubernetes/leader (fallback)
      command: >
        {{ juju_bin }} run canonical-kubernetes/leader get-kubeconfig
        -m {{ juju_controller }}:{{ juju_model }}
        --format plain
      register: kubeconfig_out_fallback
      changed_when: false
      failed_when: false
      when: kubeconfig_out.rc != 0

    - name: Print kubeconfig hint
      debug:
        msg: >
          Run one of these commands to retrieve your kubeconfig:
          juju run k8s/leader get-kubeconfig -m {{ juju_controller }}:{{ juju_model }}
          or
          juju run canonical-kubernetes/leader get-kubeconfig -m {{ juju_controller }}:{{ juju_model }}
          to retrieve your kubeconfig.
      when: kubeconfig_out.rc != 0 and (kubeconfig_out_fallback.rc | default(1)) != 0

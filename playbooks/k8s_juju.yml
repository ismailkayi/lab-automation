---
# ==============================================================================
# Canonical Kubernetes via Juju
# Deploys Canonical K8s using the canonical-kubernetes bundle on VMs provisioned
# by OpenTofu/LXD. Bootstrap happens from the Juju controller VM.
# ==============================================================================

- name: Install Juju on controller VM
  hosts: k8s_juju_controller
  gather_facts: false
  vars:
    juju_channel: "3.6/stable"
  tasks:
    - name: Wait for controller VM to boot
      wait_for_connection:
        timeout: 120

    - name: Gather facts
      setup:

    - name: Wait for snapd seed
      command: snap wait system seed.loaded
      changed_when: false

    - name: Check if juju snap is installed
      command: snap list juju
      register: juju_snap_check
      changed_when: false
      failed_when: false

    - name: Install juju snap
      command: "snap install juju --channel={{ juju_channel }}"
      when: juju_snap_check.rc != 0
      changed_when: true

- name: Wait for K8s nodes to boot
  hosts: k8s_juju_cp:k8s_juju_workers
  gather_facts: false
  tasks:
    - name: Wait for connection
      wait_for_connection:
        timeout: 120

    - name: Gather facts
      setup:

    - name: Wait for snapd seed
      command: snap wait system seed.loaded
      changed_when: false

- name: Bootstrap Juju controller and add machines
  hosts: k8s_juju_controller
  gather_facts: false
  vars:
    juju_user: "ubuntu"
    juju_home: "/home/ubuntu"
    juju_env:
      HOME: "/home/ubuntu"
      XDG_DATA_HOME: "/home/ubuntu/.local/share"
    juju_model: "k8s-lab"
    juju_controller: "lab-controller"
  tasks:
    - name: Collect controller VM IP
      setup:
        filter: ansible_default_ipv4
      register: ctrl_facts

    - name: Set controller IP fact
      set_fact:
        ctrl_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

    - name: Ensure Juju data directory exists for ubuntu
      file:
        path: "{{ juju_home }}/.local/share/juju"
        state: directory
        mode: "0755"
        owner: "{{ juju_user }}"
        group: "{{ juju_user }}"
      become: true

    - name: Ensure ubuntu SSH directory exists
      file:
        path: "{{ juju_home }}/.ssh"
        state: directory
        mode: "0700"
        owner: "{{ juju_user }}"
        group: "{{ juju_user }}"
      become: true

    - name: Ensure Juju SSH key exists for ubuntu
      command: ssh-keygen -t ed25519 -N '' -f {{ juju_home }}/.ssh/id_ed25519
      args:
        creates: "{{ juju_home }}/.ssh/id_ed25519"
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Read Juju controller public key
      slurp:
        src: "{{ juju_home }}/.ssh/id_ed25519.pub"
      register: juju_controller_pubkey_raw
      become: true

    - name: Store Juju controller public key fact
      set_fact:
        juju_controller_pubkey: "{{ juju_controller_pubkey_raw.content | b64decode | trim }}"

    - name: Check if Juju controller already bootstrapped
      command: juju controllers --format json
      register: juju_ctrl_check
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Add controller IP to known_hosts
      known_hosts:
        name: "{{ ctrl_ip }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + ctrl_ip) }}"
        state: present
        path: "{{ juju_home }}/.ssh/known_hosts"
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Bootstrap Juju manual cloud on controller VM
      command: >
        juju bootstrap
        manual/ubuntu@{{ ctrl_ip }}
        {{ juju_controller }}
      when: >
        juju_ctrl_check.rc != 0 or
        juju_controller not in (juju_ctrl_check.stdout | default(''))
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Add or reuse Juju model
      command: "juju add-model {{ juju_model }} {{ juju_controller }}"
      register: add_model_result
      failed_when:
        - add_model_result.rc != 0
        - "'already exists' not in (add_model_result.stderr | default(''))"
      changed_when: add_model_result.rc == 0
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    # --- Add K8s control-plane nodes as Juju machines ---
    - name: Add K8s CP nodes to known_hosts
      known_hosts:
        name: "{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + hostvars[item]['ansible_facts']['default_ipv4']['address']) }}"
        state: present
        path: "{{ juju_home }}/.ssh/known_hosts"
      loop: "{{ groups['k8s_juju_cp'] }}"
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Add K8s CP nodes as Juju machines
      command: >
        juju add-machine
        -m {{ juju_controller }}:{{ juju_model }}
        ssh:ubuntu@{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}
      loop: "{{ groups['k8s_juju_cp'] }}"
      register: add_cp_machines
      failed_when:
        - add_cp_machines.rc != 0
        - "'already' not in (add_cp_machines.stderr | default(''))"
      changed_when: add_cp_machines.rc == 0
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    # --- Add K8s worker nodes as Juju machines ---
    - name: Add K8s worker nodes to known_hosts
      known_hosts:
        name: "{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + hostvars[item]['ansible_facts']['default_ipv4']['address']) }}"
        state: present
        path: "{{ juju_home }}/.ssh/known_hosts"
      loop: "{{ groups['k8s_juju_workers'] }}"
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Add K8s worker nodes as Juju machines
      command: >
        juju add-machine
        -m {{ juju_controller }}:{{ juju_model }}
        ssh:ubuntu@{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}
      loop: "{{ groups['k8s_juju_workers'] }}"
      register: add_worker_machines
      failed_when:
        - add_worker_machines.rc != 0
        - "'already' not in (add_worker_machines.stderr | default(''))"
      changed_when: add_worker_machines.rc == 0
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

- name: Trust Juju controller SSH key on all Juju nodes
  hosts: k8s_juju_controller:k8s_juju_cp:k8s_juju_workers
  gather_facts: false
  vars:
    juju_controller_host: "{{ groups['k8s_juju_controller'][0] }}"
  tasks:
    - name: Authorize controller Juju key for ubuntu
      authorized_key:
        user: ubuntu
        key: "{{ hostvars[juju_controller_host]['juju_controller_pubkey'] }}"
        state: present
      become: true

- name: Deploy Canonical Kubernetes charm bundle
  hosts: k8s_juju_controller
  gather_facts: false
  vars:
    juju_user: "ubuntu"
    juju_home: "/home/ubuntu"
    juju_env:
      HOME: "/home/ubuntu"
      XDG_DATA_HOME: "/home/ubuntu/.local/share"
    juju_controller: "lab-controller"
    juju_model: "k8s-lab"
    cp_count: "{{ groups['k8s_juju_cp'] | length }}"
    worker_count: "{{ groups['k8s_juju_workers'] | length }}"
  tasks:
    - name: Check if k8s application is already deployed
      command: >
        juju status -m {{ juju_controller }}:{{ juju_model }}
        --format json
      register: juju_status
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Deploy canonical-kubernetes bundle
      command: >
        juju deploy canonical-kubernetes
        -m {{ juju_controller }}:{{ juju_model }}
        --map-machines existing
        --num-units {{ cp_count | int + worker_count | int }}
      when: >
        juju_status.rc != 0 or
        'k8s' not in (juju_status.stdout | default(''))
      changed_when: true
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Wait for Juju deployment to settle
      command: >
        juju wait-for application k8s
        -m {{ juju_controller }}:{{ juju_model }}
        --timeout 30m
      changed_when: false
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Show final Juju status
      command: >
        juju status
        -m {{ juju_controller }}:{{ juju_model }}
        --color
      register: final_juju_status
      changed_when: false
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Print Juju status
      debug:
        msg: "{{ final_juju_status.stdout_lines }}"

    - name: Fetch kubeconfig from Juju
      command: >
        juju run k8s/leader get-kubeconfig
        -m {{ juju_controller }}:{{ juju_model }}
        --format plain
      register: kubeconfig_out
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ juju_user }}"
      environment: "{{ juju_env }}"

    - name: Print kubeconfig hint
      debug:
        msg: >
          Run 'juju run k8s/leader get-kubeconfig -m {{ juju_controller }}:{{ juju_model }}'
          to retrieve your kubeconfig.
      when: kubeconfig_out.rc != 0

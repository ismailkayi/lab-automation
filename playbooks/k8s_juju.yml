---
# ==============================================================================
# Canonical Kubernetes via Juju
# Deploys Canonical K8s using the canonical-kubernetes bundle on VMs provisioned
# by OpenTofu/LXD.
#
# Design notes:
# - Keep VM-side prep minimal (wait, facts, snapd seed, juju install on controller).
# - Run Juju operations through `lxc exec <controller> ... juju ...` from localhost.
#   This avoids both host-Juju dependency and snap/cgroup issues seen in Ansible
#   remote sessions inside LXD guests.
# ==============================================================================

- name: Wait for Juju nodes and gather facts
  hosts: k8s_juju_controller:k8s_juju_cp:k8s_juju_workers
  gather_facts: false
  tasks:
    - name: Wait for node VM to boot
      wait_for_connection:
        timeout: 120

    - name: Gather facts
      setup:

    - name: Wait for snapd seed
      command: snap wait system seed.loaded
      changed_when: false

- name: Install Juju and prepare SSH key on controller
  hosts: k8s_juju_controller
  gather_facts: false
  vars:
    juju_channel: "3/stable"
    juju_user: "ubuntu"
    juju_home: "/home/ubuntu"
  tasks:
    - name: Check if juju snap is installed on controller
      command: snap list juju
      register: juju_snap_check
      changed_when: false
      failed_when: false

    - name: Install juju snap on controller if missing
      command: "snap install juju --channel={{ juju_channel }}"
      when: juju_snap_check.rc != 0
      changed_when: true
      become: true

    - name: Ensure controller ubuntu SSH directory exists
      file:
        path: "{{ juju_home }}/.ssh"
        state: directory
        mode: "0700"
        owner: "{{ juju_user }}"
        group: "{{ juju_user }}"
      become: true

    - name: Ensure controller Juju SSH key exists
      command: ssh-keygen -t ed25519 -N '' -f {{ juju_home }}/.ssh/id_ed25519
      args:
        creates: "{{ juju_home }}/.ssh/id_ed25519"
      become: true
      become_user: "{{ juju_user }}"

    - name: Read controller Juju public key
      slurp:
        src: "{{ juju_home }}/.ssh/id_ed25519.pub"
      register: juju_controller_pubkey_raw
      become: true

    - name: Store controller Juju public key
      set_fact:
        juju_controller_pubkey: "{{ juju_controller_pubkey_raw.content | b64decode | trim }}"

    - name: Add all Juju node IPs to controller known_hosts
      known_hosts:
        name: "{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}"
        key: "{{ lookup('pipe', 'ssh-keyscan ' + hostvars[item]['ansible_facts']['default_ipv4']['address']) }}"
        path: "{{ juju_home }}/.ssh/known_hosts"
        state: present
      loop: "{{ groups['k8s_juju_controller'] + groups['k8s_juju_cp'] + groups['k8s_juju_workers'] }}"
      become: true
      become_user: "{{ juju_user }}"

- name: Trust controller Juju key on all Juju nodes
  hosts: k8s_juju_controller:k8s_juju_cp:k8s_juju_workers
  gather_facts: false
  vars:
    juju_controller_host: "{{ groups['k8s_juju_controller'][0] }}"
  tasks:
    - name: Authorize controller Juju key for ubuntu
      authorized_key:
        user: ubuntu
        key: "{{ hostvars[juju_controller_host]['juju_controller_pubkey'] }}"
        state: present
      become: true

- name: Bootstrap Juju and deploy Canonical Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    juju_model: "k8s-lab"
    juju_controller: "lab-controller"
    juju_controller_host: "{{ groups['k8s_juju_controller'][0] }}"
    juju_controller_ip: "{{ hostvars[juju_controller_host]['ansible_facts']['default_ipv4']['address'] }}"
    juju_cp_hosts: "{{ groups['k8s_juju_cp'] | default([]) }}"
    juju_worker_hosts: "{{ groups['k8s_juju_workers'] | default([]) }}"
    juju_machine_hosts: "{{ juju_cp_hosts + juju_worker_hosts }}"
  tasks:
    - name: Check if Juju controller already bootstrapped
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju controllers --format json
      register: juju_ctrl_check
      changed_when: false
      failed_when: false

    - name: Bootstrap Juju manual cloud on controller VM
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju bootstrap
        manual/ubuntu@{{ juju_controller_ip }}
        {{ juju_controller }}
      when: >
        juju_ctrl_check.rc != 0 or
        juju_controller not in (juju_ctrl_check.stdout | default(''))

    - name: Add or reuse Juju model
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju add-model {{ juju_model }} --controller {{ juju_controller }}
      register: add_model_result
      failed_when:
        - add_model_result.rc != 0
        - "'already exists' not in (add_model_result.stderr | default(''))"
      changed_when: add_model_result.rc == 0

    - name: Add Juju machines for Kubernetes nodes
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju add-machine
        -m {{ juju_controller }}:{{ juju_model }}
        ssh:ubuntu@{{ hostvars[item]['ansible_facts']['default_ipv4']['address'] }}
      loop: "{{ juju_machine_hosts }}"
      register: add_machines_result
      failed_when:
        - add_machines_result.rc != 0
        - "'already' not in (add_machines_result.stderr | default('') | lower)"
      changed_when: add_machines_result.rc == 0

    - name: Check if k8s application is already deployed
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju status -m {{ juju_controller }}:{{ juju_model }}
        --format json
      register: juju_status
      changed_when: false
      failed_when: false

    - name: Parse Juju applications from status JSON
      set_fact:
        juju_status_json: "{{ (juju_status.stdout | default('{}')) | from_json }}"
        juju_applications: "{{ ((juju_status.stdout | default('{}')) | from_json).applications | default({}) }}"

    - name: Parse Juju machines from status JSON
      set_fact:
        juju_machines: "{{ juju_status_json.machines | default({}) }}"

    - name: Determine whether bundle deploy is required
      set_fact:
        juju_bundle_deploy_required: "{{ 'k8s' not in juju_applications and 'canonical-kubernetes' not in juju_applications }}"

    - name: Map control-plane hosts to Juju machine ids
      set_fact:
        juju_cp_machine_ids: "{{ (juju_cp_machine_ids | default([])) + [juju_machine_id] }}"
      vars:
        juju_machine_id: >-
          {{
            (
              juju_machines
              | dict2items
              | selectattr('value.hostname', 'defined')
              | selectattr('value.hostname', 'equalto', item)
              | map(attribute='key')
              | list
              | first
            ) | default('')
          }}
      loop: "{{ juju_cp_hosts }}"
      failed_when: juju_machine_id == ''

    - name: Map worker hosts to Juju machine ids
      set_fact:
        juju_worker_machine_ids: "{{ (juju_worker_machine_ids | default([])) + [juju_machine_id] }}"
      vars:
        juju_machine_id: >-
          {{
            (
              juju_machines
              | dict2items
              | selectattr('value.hostname', 'defined')
              | selectattr('value.hostname', 'equalto', item)
              | map(attribute='key')
              | list
              | first
            ) | default('')
          }}
      loop: "{{ juju_worker_hosts }}"
      failed_when: juju_machine_id == ''

    - name: Collect currently assigned control-plane machine ids
      set_fact:
        juju_k8s_machine_ids: >-
          {{
            juju_applications.get('k8s', {}).get('units', {})
            | dict2items
            | map(attribute='value.machine')
            | list
          }}

    - name: Collect currently assigned worker machine ids
      set_fact:
        juju_k8s_worker_machine_ids: >-
          {{
            juju_applications.get('k8s-worker', {}).get('units', {})
            | dict2items
            | map(attribute='value.machine')
            | list
          }}

    - name: Determine missing control-plane placements
      set_fact:
        juju_cp_machine_ids_to_add: "{{ juju_cp_machine_ids | reject('in', juju_k8s_machine_ids | default([])) | list }}"

    - name: Determine missing worker placements
      set_fact:
        juju_worker_machine_ids_to_add: "{{ juju_worker_machine_ids | reject('in', juju_k8s_worker_machine_ids | default([])) | list }}"

    - name: Build bundle overlay on controller for manual machine mapping
      shell: |
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes ubuntu@{{ juju_controller_ip }} "cat > /home/ubuntu/k8s-bundle-overlay.yaml <<'EOF'
        machines:
        {% for i in range(0, juju_cp_hosts | length + juju_worker_hosts | length) %}
          \"{{ i }}\": {}
        {% endfor %}
        applications:
          k8s:
            num_units: {{ juju_cp_hosts | length }}
            constraints: \"\"
            to:
        {% for i in range(0, juju_cp_hosts | length) %}
              - \"{{ i }}\"
        {% endfor %}
          k8s-worker:
            num_units: {{ juju_worker_hosts | length }}
            constraints: \"\"
            to:
        {% for i in range(juju_cp_hosts | length, juju_cp_hosts | length + juju_worker_hosts | length) %}
              - \"{{ i }}\"
        {% endfor %}
        EOF"
      changed_when: false

    - name: Deploy canonical-kubernetes bundle
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju deploy canonical-kubernetes
        --channel 1.32/stable
        --trust
        --map-machines existing
        --overlay /home/ubuntu/k8s-bundle-overlay.yaml
        -m {{ juju_controller }}:{{ juju_model }}
      when: juju_bundle_deploy_required
      changed_when: true

    - name: Add missing control-plane units to existing deployment
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju add-unit k8s
        -m {{ juju_controller }}:{{ juju_model }}
        --to {{ item }}
      loop: "{{ juju_cp_machine_ids_to_add }}"
      when:
        - not juju_bundle_deploy_required
        - "'k8s' in juju_applications"
        - (juju_cp_machine_ids_to_add | length) > 0
      changed_when: true

    - name: Add missing worker units to existing deployment
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju add-unit k8s-worker
        -m {{ juju_controller }}:{{ juju_model }}
        --to {{ item }}
      loop: "{{ juju_worker_machine_ids_to_add }}"
      when:
        - not juju_bundle_deploy_required
        - "'k8s-worker' in juju_applications"
        - (juju_worker_machine_ids_to_add | length) > 0
      changed_when: true

    - name: Wait for Kubernetes application to become active
      shell: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        "juju wait-for application k8s -m {{ juju_controller }}:{{ juju_model }} --timeout 30m
        && juju wait-for application k8s-worker -m {{ juju_controller }}:{{ juju_model }} --timeout 30m
        || juju wait-for application canonical-kubernetes -m {{ juju_controller }}:{{ juju_model }} --timeout 30m"
      changed_when: false

    - name: Show final Juju status
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju status
        -m {{ juju_controller }}:{{ juju_model }}
        --color
      register: final_juju_status
      changed_when: false

    - name: Print Juju status
      debug:
        msg: "{{ final_juju_status.stdout_lines }}"

    - name: Fetch kubeconfig from k8s/leader
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju run k8s/leader get-kubeconfig
        -m {{ juju_controller }}:{{ juju_model }}
        --format plain
      register: kubeconfig_out
      changed_when: false
      failed_when: false

    - name: Fetch kubeconfig from canonical-kubernetes/leader (fallback)
      command: >
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        ubuntu@{{ juju_controller_ip }}
        juju run canonical-kubernetes/leader get-kubeconfig
        -m {{ juju_controller }}:{{ juju_model }}
        --format plain
      register: kubeconfig_out_fallback
      changed_when: false
      failed_when: false
      when: kubeconfig_out.rc != 0

    - name: Print kubeconfig hint
      debug:
        msg: >
          Run one of these commands to retrieve your kubeconfig:
          juju run k8s/leader get-kubeconfig -m {{ juju_controller }}:{{ juju_model }}
          or
          juju run canonical-kubernetes/leader get-kubeconfig -m {{ juju_controller }}:{{ juju_model }}
          to retrieve your kubeconfig.
      when: kubeconfig_out.rc != 0 and (kubeconfig_out_fallback.rc | default(1)) != 0
